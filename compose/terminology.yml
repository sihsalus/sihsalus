x-service: &service
  restart: unless-stopped
  cgroup_parent: sihsalus-terminology.slice
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true

x-app: &app
  <<: *service
  image: ${TERMINOLOGY_API_IMAGE:?Set the verified API image digest}
  read_only: true
  tmpfs:
    - /tmp:uid=10001,gid=10001,size=256m
    - /temp:uid=10001,gid=10001,size=32m
  volumes:
    - uploads:/code/uploads
  environment: &app-env
    ENVIRONMENT: production
    DEBUG: "FALSE"
    NO_LM: "TRUE"
    NO_ENCODER: "TRUE"
    # Bounded migration batches finish within this cache window; reports persist in PostgreSQL.
    CELERY_RESULT_EXPIRES: "3600"
    DB_HOST: db
    DB_PORT: "5432"
    DB: postgres
    DB_USER: postgres
    DB_PASSWORD: ${TERMINOLOGY_DB_PASSWORD:?Set the database password}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    ES_HOSTS: es:9200
    ES_SCHEME: http
    SECRET_KEY: ${TERMINOLOGY_SECRET_KEY:?Set the Django secret}
    ALLOWED_HOSTS: ${TERMINOLOGY_API_HOST:?Set the public API hostname},${TERMINOLOGY_HOST:?Set the public hostname},api,localhost,127.0.0.1
    WEB_URL: https://${TERMINOLOGY_HOST}
    API_BASE_URL: https://${TERMINOLOGY_API_HOST}
    API_INTERNAL_BASE_URL: http://api:8000
    CORS_ALLOWED_ORIGINS: https://${TERMINOLOGY_HOST}
    CSRF_TRUSTED_ORIGINS: https://${TERMINOLOGY_HOST},https://${TERMINOLOGY_API_HOST}
    TRUST_PROXY_HTTPS: "TRUE"
    REQUIRE_AUTHENTICATION: "true"
    ALLOW_SELF_REGISTRATION: "false"
    ENABLE_THROTTLING: "true"
    # Enable SMTP explicitly after provisioning the installation's sender.
    EMAIL_BACKEND: ${TERMINOLOGY_EMAIL_BACKEND:-django.core.mail.backends.dummy.EmailBackend}
    EMAIL_HOST: ${TERMINOLOGY_EMAIL_HOST:-smtp.gmail.com}
    EMAIL_PORT: ${TERMINOLOGY_EMAIL_PORT:-587}
    EMAIL_USE_TLS: "true"
    EMAIL_TIMEOUT: "20"
    EMAIL_HOST_USER: ${TERMINOLOGY_EMAIL_HOST_USER:-}
    EMAIL_HOST_PASSWORD: ${TERMINOLOGY_EMAIL_HOST_PASSWORD:-}
    DEFAULT_FROM_EMAIL: ${TERMINOLOGY_DEFAULT_FROM_EMAIL:-webmaster@localhost}
    COMMUNITY_EMAIL: ${TERMINOLOGY_COMMUNITY_EMAIL:-}
    REPORTS_EMAIL: ${TERMINOLOGY_REPORTS_EMAIL:-}
    # Error notifications remain opt-in; they can include request diagnostics.
    ADMIN_EMAIL: ${TERMINOLOGY_ADMIN_EMAIL:-}
    ANALYTICS_API: ""
    EXPORT_SERVICE: core.services.storages.cloud.minio.MinIO
    MINIO_ENDPOINT: storage:9000
    MINIO_EXTERNAL_ENDPOINT: ${TERMINOLOGY_HOST}
    MINIO_SECURE: "FALSE"
    MINIO_EXTERNAL_SECURE: "TRUE"
    MINIO_BUCKET_NAME: terminology-exports
    MINIO_ACCESS_KEY: ${TERMINOLOGY_STORAGE_ACCESS_KEY:?Set the object storage access key}
    MINIO_SECRET_KEY: ${TERMINOLOGY_STORAGE_SECRET_KEY:?Set the object storage secret}
  stop_grace_period: 120s

services:
  db:
    <<: *service
    image: ${TERMINOLOGY_POSTGRES_IMAGE:?Set the verified PostgreSQL image digest}
    mem_limit: 640m
    cpus: 0.75
    shm_size: 128m
    environment:
      POSTGRES_PASSWORD: ${TERMINOLOGY_DB_PASSWORD:?Set the database password}
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40]
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    <<: *service
    image: ${TERMINOLOGY_REDIS_IMAGE:?Set the verified Redis image digest}
    mem_limit: 256m
    cpus: 0.25
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 6

  es:
    <<: *service
    image: ${TERMINOLOGY_ELASTICSEARCH_IMAGE:?Set the verified Elasticsearch image digest}
    mem_limit: 1536m
    cpus: 0.75
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: [CMD-SHELL, "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' | grep -Eq '\"status\":\"(yellow|green)\"'"]
      interval: 15s
      timeout: 5s
      retries: 20

  storage:
    <<: *service
    image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    mem_limit: 384m
    cpus: 0.25
    command: [/data]
    environment:
      RUSTFS_ACCESS_KEY: ${TERMINOLOGY_STORAGE_ACCESS_KEY:?Set the object storage access key}
      RUSTFS_SECRET_KEY: ${TERMINOLOGY_STORAGE_SECRET_KEY:?Set the object storage secret}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - objects:/data

  bootstrap:
    <<: *app
    profiles: [maintenance]
    restart: "no"
    mem_limit: 768m
    cpus: 1.0
    command: [bash, ./pre_startup.sh]
    environment:
      <<: *app-env
      API_SUPERUSER_PASSWORD: ${TERMINOLOGY_ADMIN_PASSWORD:?Set the administrator password}
      API_SUPERUSER_TOKEN: ${TERMINOLOGY_ADMIN_TOKEN:?Set the administrator token}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      es: {condition: service_healthy}

  api:
    <<: *app
    mem_limit: 768m
    cpus: 1.0
    environment:
      <<: *app-env
      SKIP_MIGRATE_DB: "true"
      WEB_CONCURRENCY: "2"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      es: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8000/version/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10

  worker:
    <<: *app
    mem_limit: 768m
    cpus: 1.0
    environment:
      <<: *app-env
      # Reuse connections only in the bounded prefork executor processes.
      DB_CONN_MAX_AGE: "60"
    # Direct PID 1 receives Docker's stop signal and finishes active tasks gracefully.
    command: [celery, -A, core, worker, -n, "executor@%h", --loglevel=INFO, -E, -P, prefork, -Q, "default,indexing,concurrent", -c, "2"]
    depends_on:
      api: {condition: service_healthy}

  importer:
    <<: *app
    mem_limit: 384m
    cpus: 0.50
    # Import coordinators wait for tasks on concurrent; keep separate consumers.
    command: [celery, -A, core, worker, -n, "importer@%h", --loglevel=INFO, -E, -P, prefork, -Q, "bulk_import_root,bulk_import_0,bulk_import_1,bulk_import_2,bulk_import_3", -c, "1"]
    depends_on:
      api: {condition: service_healthy}

  scheduler:
    <<: *app
    mem_limit: 192m
    cpus: 0.25
    command: [celery, -A, core, beat, -l, info, -S, django, --pidfile=/tmp/celerybeat.pid]
    depends_on:
      api: {condition: service_healthy}

  web:
    <<: *service
    image: ${TERMINOLOGY_WEB_IMAGE:?Set the verified web image digest}
    mem_limit: 64m
    cpus: 0.25
    environment:
      API_URL: https://${TERMINOLOGY_API_HOST}
      NODE_ENV: production
      WEB_PORT: "4002"
      ANALYTICS_API: ""
      AI_ASSISTANT_API_URL: ""
    ports:
      - "127.0.0.1:4000:4002"
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:4002/"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres:
  redis:
  elasticsearch:
  uploads:
  objects:

# Medical Imaging Stack (DICOM/OHIF/Orthanc)
# Profile: imaging

services:
  ohif:
    container_name: sihsalus-ohif
    # Compile PUBLIC_URL into OHIF; the upstream root build cannot be moved
    # under /imaging/ by changing only its React router configuration.
    build:
      context: ./imaging
    restart: "unless-stopped"
    profiles: [ imaging ]
    ports:
      # Solo host: el acceso de usuarios es via gateway (/imaging/).
      - "127.0.0.1:3000:80"
    depends_on:
      orthanc-proxy:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/sihsalus-bootstrap.js" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - default

  orthanc:
    container_name: sihsalus-orthanc
    image: orthancteam/orthanc:25.8.2
    restart: "unless-stopped"
    profiles: [ imaging ]
    ports:
      # Orthanc corre con AuthenticationEnabled=false: su HTTP (8042) NO debe
      # exponerse a la red. El acceso web es via gateway (/orthanc/, /dicom-web/).
      - "127.0.0.1:8042:8042"
      # Seguro por defecto. Define DICOM_BIND_ADDRESS con la IP LAN concreta
      # solo cuando las modalidades deban enviar estudios a este host.
      - "${DICOM_BIND_ADDRESS:-127.0.0.1}:${DICOM_PORT:-4242}:4242"
    environment:
      ORTHANC_JSON: |
        {
          "Name": "SIHSALUS Orthanc",
          "RemoteAccessAllowed": true,
          "AuthenticationEnabled": ${ORTHANC_AUTHENTICATION_ENABLED:-false},
          "RegisteredUsers": {},
          "DicomAet": "ORTHANC",
          "DicomPort": 4242,
          "DicomCheckCalledAet": ${ORTHANC_DICOM_CHECK_CALLED_AET:-true},
          "OrthancExplorer2": {
            "Enable": true,
            "IsDefaultOrthancUI": true,
            "UiOptions": {
              "EnableUpload": false,
              "EnableDeleteResources": false,
              "EnableDicomModalities": false,
              "EnableAnonymization": false,
              "EnableModification": false,
              "EnableSendTo": false,
              "EnableSettings": false,
              "EnableEditLabels": false,
              "EnableShares": false,
              "EnableAddSeries": false,
              "EnableLinkToLegacyUi": false,
              "EnableOpenInOhifViewer3": true,
              "OhifViewer3PublicRoot": "/imaging/"
            }
          },
          "DicomWeb": {
            "Enable": true,
            "Root": "/dicom-web/",
            "PublicRoot": "/dicom-web/",
            "EnableWado": true,
            "WadoRoot": "/wado",
            "Ssl": false
          },
          "StableAge": 60,
          "StrictAetComparison": ${ORTHANC_STRICT_AET_COMPARISON:-true},
          "HttpTimeout": 60,
          "ConcurrentJobs": 2,
          "OverwriteInstances": ${ORTHANC_OVERWRITE_INSTANCES:-false}
        }
    volumes:
      - orthanc-data:/var/lib/orthanc/db
      - ./imaging/orthanc-healthcheck.py:/usr/local/bin/sihsalus-orthanc-healthcheck.py:ro
    healthcheck:
      test: [ "CMD", "python3", "/usr/local/bin/sihsalus-orthanc-healthcheck.py" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - default

  orthanc-proxy:
    container_name: sihsalus-orthanc-proxy
    image: nginx:1.28-alpine
    restart: "unless-stopped"
    profiles: [ imaging ]
    ports:
      # Solo host: el gateway llega por la red interna de Docker.
      - "127.0.0.1:8043:80"
    volumes:
      - ./gateway/orthanc-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      orthanc:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/plugins/dicom-web" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default

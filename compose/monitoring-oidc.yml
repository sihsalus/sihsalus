# Opt-in only, after compose/keycloak.yml; see docs/operations/grafana-oidc.md.
# This file does not provision clients, roles or users in the clinical realm.
services:
  grafana:
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?GRAFANA_ROOT_URL is required for Grafana OIDC}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      # OAuth authorization redirects can originate from a different site.
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: sihsalus-grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:?GRAFANA_OIDC_CLIENT_SECRET is required for Grafana OIDC}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${KEYCLOAK_PUBLIC_URL:?KEYCLOAK_PUBLIC_URL is required for Grafana OIDC}/realms/openmrs/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/openmrs/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/openmrs/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
      GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: "false"
      # Projection requires an array; a scalar/absent claim cannot match a role.
      # No valid result means deny. Viewer is also an explicit client role.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: >-
        contains(resource_access."sihsalus-grafana".roles[*], 'grafana-admin') && 'Admin'
        || contains(resource_access."sihsalus-grafana".roles[*], 'grafana-editor') && 'Editor'
        || contains(resource_access."sihsalus-grafana".roles[*], 'grafana-viewer') && 'Viewer'
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      # New OAuth users still require a mapped role; local public signup stays off.
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: "false"
      # Local logout only. Ending a Keycloak SSO session is an operator/user step.
      GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: ""
      GF_AUTH_SIGNOUT_REDIRECT_URL: ""
    networks:
      - auth-network

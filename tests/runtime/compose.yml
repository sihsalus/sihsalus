# CI-only isolation; the service definitions and application configuration come
# from docker-compose.yml and its normal Keycloak override.
services:
  gateway:
    container_name: ${COMPOSE_PROJECT_NAME}-gateway
    restart: "no"
    ports: !override ["127.0.0.1:80:80"]
  frontend:
    container_name: ${COMPOSE_PROJECT_NAME}-frontend
    restart: "no"
    pull_policy: never
    build:
      args:
        FRONTEND_SOURCE_IMAGE: ghcr.io/sihsalus/sihsalus-frontend:sha-b956aba619e4e651e7d942e3f95eb88f607803e5@sha256:089d96130cca872d9b08f7e55e8ef354daf7ee77e19b72f8b28db8a4522bc1c2
  docs:
    container_name: ${COMPOSE_PROJECT_NAME}-docs
    restart: "no"
  backend:
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    restart: "no"
    environment:
      OMRS_ADMIN_USER_PASSWORD: ${SMOKE_INITIAL_PASSWORD:?synthetic password required}
      OMRS_JAVA_MEMORY_OPTS: -Xms512m -Xmx3g
      OMRS_EXTRA_INITIALIZER_STARTUP_LOAD: fail_on_error
  backend-oauth2-config:
    container_name: ${COMPOSE_PROJECT_NAME}-oauth2-config
  db:
    container_name: ${COMPOSE_PROJECT_NAME}-db
    restart: "no"
    volumes:
      - ./scripts/database/db_init_master.sh:/docker-entrypoint-initdb.d/db_init_master.sh:ro

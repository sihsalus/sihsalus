# Prometheus Configuration for SIHSALUS
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'sihsalus-production'
    environment: 'docker'

# Load rules once and periodically evaluate them
rule_files:
  - "/etc/prometheus/alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Blackbox HTTP endpoint probes
  - job_name: 'blackbox-http-prod'
    metrics_path: /probe
    params:
      module: [ http_2xx_ignore_ssl ]
    static_configs:
      - targets:
          - "http://gateway:80/"
          - "http://gateway:80/openmrs"
          - "http://gateway:80/openmrs/ws/rest/v1/session"
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: __param_target
      - source_labels: [ __param_target ]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # The HTTPS probe provides certificate-expiration metrics. Certificate
  # identity validation is intentionally skipped because the internal Docker
  # hostname differs from the certificate SAN; expiry is still read from the
  # certificate actually served by the production gateway.
  - job_name: 'blackbox-https-certificate'
    metrics_path: /probe
    params:
      module: [ http_2xx_ignore_ssl ]
    static_configs:
      - targets: ["https://gateway:443/"]
        labels:
          service: 'gateway-tls'
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: __param_target
      - source_labels: [ __param_target ]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Probe the LAN listener rather than the container itself. This catches a
  # missing host bind, firewall regression or stopped standalone Samba stack.
  - job_name: 'blackbox-tcp-samba'
    metrics_path: /probe
    params:
      module: [ tcp_connect ]
    static_configs:
      - targets: ["192.168.88.20:445"]
        labels:
          service: 'samba-backup'
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: __param_target
      - source_labels: [ __param_target ]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Grafana metrics. Grafana serves from a sub-path behind the gateway, so
  # /metrics redirects to the public root_url, which is unreachable from the
  # monitoring network. Scrape the sub-path directly instead.
  - job_name: 'grafana'
    metrics_path: /grafana/metrics
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'

  # Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'

  # Linux host metrics (CPU, memory, filesystems, network, load, uptime)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          host: 'sihsalus-main-server'

  # Read-only adapter for the ViewPower instance attached to the host USB UPS.
  - job_name: 'viewpower-ups'
    static_configs:
      - targets: ['viewpower-exporter:9199']
        labels:
          service: 'ups'

  # Per-container resource metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'

  # Alert routing, grouping and silences
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'

  # Structured local application checks. These are more reliable for alerting
  # than deriving health from the textual Gatus log stream.
  - job_name: 'gatus'
    static_configs:
      - targets: ['gatus:8080']
        labels:
          service: 'gatus'

  # OpenMRS Backend metrics (JMX exporter - requires configuration)
  # - job_name: 'openmrs-backend'
  #   metrics_path: '/openmrs/metrics'
  #   static_configs:
  #     - targets: ['backend:8080']

  # MariaDB Exporter (if configured)
  # - job_name: 'mariadb-master'
  #   static_configs:
  #     - targets: ['mariadb-exporter:9104']

  # Keycloak metrics
  # - job_name: 'keycloak'
  #   metrics_path: '/metrics'
  #   static_configs:
  #     - targets: ['keycloak:8080']

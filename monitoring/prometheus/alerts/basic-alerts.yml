groups:
  - name: sihsalus_service_health
    interval: 30s
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "No se puede consultar {{ $labels.job }} en {{ $labels.instance }}"
          description: "El target lleva al menos 5 minutos sin responder. Revise el dashboard Estado operativo y el servicio {{ $labels.job }}."
          dashboard: "/d/sihsalus-operations"

      - alert: PrometheusConfigurationReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Prometheus rechazó su configuración"
          description: "La última recarga de Prometheus falló. Valide prometheus.yml y las reglas con promtool antes de reiniciar."
          dashboard: "/d/sihsalus-operations"

      - alert: SihsalusEndpointProbeFailing
        expr: probe_success{job="blackbox-http-prod"} == 0
        for: 2m
        labels:
          severity: critical
          team: application
        annotations:
          summary: "SIHSALUS no responde: {{ $labels.instance }}"
          description: "La sonda recibió una respuesta inválida o no pudo conectarse durante 2 minutos. Confirme gateway, OpenMRS y base de datos."
          dashboard: "/d/openmrs-overview"

      - alert: SihsalusEndpointSlow
        expr: probe_duration_seconds{job="blackbox-http-prod"} > 2
        for: 10m
        labels:
          severity: warning
          team: application
        annotations:
          summary: "SIHSALUS responde lentamente: {{ $labels.instance }}"
          description: "La latencia de la sonda supera 2 segundos desde hace 10 minutos (valor actual: {{ $value | humanizeDuration }})."
          dashboard: "/d/openmrs-overview"

      - alert: GatusEndpointFailing
        expr: gatus_results_endpoint_success == 0
        for: 2m
        labels:
          severity: critical
          team: application
        annotations:
          summary: "Comprobación local fallida: {{ $labels.name }}"
          description: "Gatus confirma que {{ $labels.name }} lleva 2 minutos fallando desde la red interna del sistema."
          dashboard: "/d/sihsalus-operations"

  - name: sihsalus_host_health
    interval: 30s
    rules:
      - alert: HostCpuSaturated
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 15m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "CPU del servidor por encima de 90%"
          description: "La CPU promedio de {{ $labels.instance }} lleva 15 minutos por encima de 90% (actual: {{ $value | humanize }}%)."
          dashboard: "/d/sihsalus-infrastructure"

      - alert: HostMemoryPressure
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 15m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Memoria del servidor por encima de 90%"
          description: "La memoria utilizada de {{ $labels.instance }} lleva 15 minutos por encima de 90% (actual: {{ $value | humanize }}%)."
          dashboard: "/d/sihsalus-infrastructure"

      - alert: HostFilesystemSpaceLow
        expr: 100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) > 85
        for: 30m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Poco espacio en {{ $labels.mountpoint }}"
          description: "El filesystem {{ $labels.device }} en {{ $labels.instance }} supera 85% de uso desde hace 30 minutos (actual: {{ $value | humanize }}%)."
          dashboard: "/d/sihsalus-infrastructure"

      - alert: HostFilesystemSpaceCritical
        expr: 100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) > 95
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Espacio crítico en {{ $labels.mountpoint }}"
          description: "El filesystem {{ $labels.device }} en {{ $labels.instance }} supera 95% de uso (actual: {{ $value | humanize }}%). Libere espacio de inmediato."
          dashboard: "/d/sihsalus-infrastructure"

      - alert: HostFilesystemWillFillIn24Hours
        expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0 and node_filesystem_avail_bytes > 0
        for: 1h
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "{{ $labels.mountpoint }} podría llenarse en 24 horas"
          description: "La tendencia de las últimas 6 horas predice que {{ $labels.device }} agotará su espacio dentro de 24 horas."
          dashboard: "/d/sihsalus-infrastructure"

      - alert: HostFilesystemInodesLow
        expr: 100 * (node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_files{fstype!~"tmpfs|overlay|squashfs"}) < 10
        for: 30m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Pocos inodos libres en {{ $labels.mountpoint }}"
          description: "Queda menos de 10% de inodos libres en {{ $labels.device }} de {{ $labels.instance }}."
          dashboard: "/d/sihsalus-infrastructure"

      - alert: ContainerOomKilled
        expr: increase(container_oom_events_total{container_label_com_docker_compose_project="sihsalus"}[10m]) > 0
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Un contenedor de SIHSALUS agotó su memoria"
          description: "{{ $labels.name }} registró un evento OOM en los últimos 10 minutos. Revise consumo, límites y logs."
          dashboard: "/d/sihsalus-infrastructure"

  - name: sihsalus_resilience
    interval: 1m
    rules:
      - alert: OperationsCollectorStale
        expr: time() - sihsalus_operations_collector_last_run_seconds > 300
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "El colector operativo dejó de actualizar métricas"
          description: "Las métricas de backups llevan más de 5 minutos sin actualizarse. Revise sihsalus-operations-collector."
          dashboard: "/d/sihsalus-resilience"

      - alert: BackupArtifactMissing
        expr: sihsalus_backup_latest_timestamp_seconds == 0
        for: 10m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "No existe backup cifrado de {{ $labels.backup }}"
          description: "El colector no encontró ningún artefacto cifrado para {{ $labels.backup }} en la ruta configurada."
          dashboard: "/d/sihsalus-resilience"

      - alert: BackupArtifactStale
        expr: (time() - sihsalus_backup_latest_timestamp_seconds > 8 * 3600) and (sihsalus_backup_latest_timestamp_seconds > 0)
        for: 30m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Backup de {{ $labels.backup }} retrasado"
          description: "El artefacto cifrado más reciente de {{ $labels.backup }} tiene más de 8 horas."
          dashboard: "/d/sihsalus-resilience"

      - alert: BackupArtifactStaleCritical
        expr: (time() - sihsalus_backup_latest_timestamp_seconds > 14 * 3600) and (sihsalus_backup_latest_timestamp_seconds > 0)
        for: 10m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Backup de {{ $labels.backup }} críticamente retrasado"
          description: "El artefacto cifrado más reciente de {{ $labels.backup }} tiene más de 14 horas. Intervenga y compruebe su checksum."
          dashboard: "/d/sihsalus-resilience"

      - alert: VpnInterfaceDown
        expr: (sihsalus_network_carrier{device=~"tun0|tun1"} == 0) and (sihsalus_network_interface_present == 1)
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "La interfaz VPN {{ $labels.device }} está abajo"
          description: "Node Exporter detecta {{ $labels.device }} en estado down desde hace 5 minutos."
          dashboard: "/d/sihsalus-resilience"

      - alert: VpnInterfaceMissing
        expr: sihsalus_network_interface_present{device=~"tun0|tun1"} == 0
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Falta una interfaz VPN esperada"
          description: "No se observan ambas interfaces tun0/tun1. Revise CloudConnexa y el watchdog de GOREL."
          dashboard: "/d/sihsalus-resilience"

      - alert: GatewayCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-https-certificate"} - time()) / 86400 < 30
        for: 1h
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "El certificado HTTPS vence en menos de 30 días"
          description: "El certificado servido por el gateway vence en {{ $value | humanize }} días."
          dashboard: "/d/sihsalus-resilience"

      - alert: GatewayCertificateExpiringCritical
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-https-certificate"} - time()) / 86400 < 7
        for: 15m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "El certificado HTTPS vence en menos de 7 días"
          description: "El certificado servido por el gateway vence en {{ $value | humanize }} días. Renueve y valide la cadena de inmediato."
          dashboard: "/d/sihsalus-resilience"

      - alert: HostTemperatureHigh
        expr: max(node_hwmon_temp_celsius) > 80
        for: 15m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Temperatura alta en el servidor"
          description: "Un sensor del host supera 80 °C desde hace 15 minutos (actual: {{ $value | humanize }} °C)."
          dashboard: "/d/sihsalus-resilience"

  - name: sihsalus_power
    interval: 15s
    rules:
      - alert: UpsTelemetryUnavailable
        expr: sihsalus_ups_exporter_up == 0
        for: 2m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "No se puede leer la UPS desde ViewPower"
          description: "ViewPower o la comunicación USB no entrega una muestra válida desde hace 2 minutos. Revise el proceso ViewPower y el dispositivo USB 0665:5161."
          dashboard: "/d/sihsalus-resilience"

      - alert: UpsRunningOnBattery
        expr: sihsalus_ups_on_battery == 1
        for: 1m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "El servidor funciona con batería"
          description: "La UPS lleva al menos un minuto sin alimentación de red. Consulte la autonomía restante en el dashboard de Resiliencia."
          dashboard: "/d/sihsalus-resilience"

      - alert: UpsBatteryChargeLow
        expr: (sihsalus_ups_battery_charge_percent < 40) and (sihsalus_ups_battery_charge_percent >= 20)
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Carga de UPS por debajo de 40%"
          description: "La batería permanece en {{ $value | humanize }}%. Confirme que está cargando y revise su vida útil."
          dashboard: "/d/sihsalus-resilience"

      - alert: UpsBatteryChargeCritical
        expr: sihsalus_ups_battery_charge_percent < 20
        for: 2m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Carga crítica de UPS"
          description: "La batería permanece por debajo de 20% (actual: {{ $value | humanize }}%). Prepare un apagado controlado si no vuelve la energía."
          dashboard: "/d/sihsalus-resilience"

      - alert: UpsRuntimeCritical
        expr: (sihsalus_ups_battery_runtime_seconds < 900) and (sihsalus_ups_on_battery == 1)
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Quedan menos de 15 minutos de UPS"
          description: "La autonomía estimada es {{ $value | humanizeDuration }} mientras el servidor funciona con batería."
          dashboard: "/d/sihsalus-resilience"

      - alert: UpsLoadHigh
        expr: sihsalus_ups_load_percent > 80
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Carga alta en la UPS"
          description: "La salida de la UPS supera 80% desde hace 10 minutos (actual: {{ $value | humanize }}%)."
          dashboard: "/d/sihsalus-resilience"

      - alert: UpsTemperatureHigh
        expr: sihsalus_ups_temperature_celsius > 45
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Temperatura alta en la UPS"
          description: "La UPS supera 45 °C desde hace 10 minutos (actual: {{ $value | humanize }} °C)."
          dashboard: "/d/sihsalus-resilience"

      - alert: UpsWarningPresent
        expr: sihsalus_ups_warning_count > 0
        for: 2m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "ViewPower reporta una advertencia de UPS"
          description: "La UPS mantiene {{ $value | humanize }} advertencia(s). Abra ViewPower para consultar el detalle."
          dashboard: "/d/sihsalus-resilience"

  - name: sihsalus_samba
    interval: 30s
    rules:
      - alert: SambaUnavailable
        expr: probe_success{job="blackbox-tcp-samba"} == 0
        for: 2m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "El servicio Samba de RRHH no responde"
          description: "El puerto SMB de 192.168.88.20 lleva 2 minutos sin aceptar conexiones. Revise el stack sihsalus-samba-backup."
          dashboard: "/d/sihsalus-resilience"

      - alert: SambaDataPathMissing
        expr: sihsalus_samba_data_present == 0
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Falta el árbol de datos de Samba"
          description: "El colector no puede ver /srv/sihsalus-backups/samba. Revise el montaje antes de aceptar escrituras."
          dashboard: "/d/sihsalus-resilience"

      - alert: SambaShareMissing
        expr: sihsalus_samba_share_present == 0
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Falta el share {{ $labels.share }}"
          description: "El colector no puede ver el directorio del share {{ $labels.share }} en /srv/sihsalus-backups/samba."
          dashboard: "/d/sihsalus-resilience"

      - alert: SambaQuotaHigh
        expr: (100 * sihsalus_samba_used_bytes / sihsalus_samba_quota_bytes > 85) and (100 * sihsalus_samba_used_bytes / sihsalus_samba_quota_bytes <= 95)
        for: 30m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "La cuota Samba supera 85%"
          description: "Los shares de RRHH usan {{ $value | humanize }}% de la cuota lógica de 20 GiB."
          dashboard: "/d/sihsalus-resilience"

      - alert: SambaQuotaCritical
        expr: 100 * sihsalus_samba_used_bytes / sihsalus_samba_quota_bytes > 95
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "La cuota Samba está casi agotada"
          description: "Los shares de RRHH superan 95% de la cuota lógica (actual: {{ $value | humanize }}%)."
          dashboard: "/d/sihsalus-resilience"

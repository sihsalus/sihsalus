# Grafana Datasources Configuration for SIHSALUS
apiVersion: 1

# Grafana data source UIDs are immutable. These entries perform the one-time
# migration from the previously auto-generated UIDs to stable, versioned UIDs.
# Data remains in Prometheus/Loki; only Grafana's connection records change.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  # Prometheus datasource
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      queryTimeout: 60s
      httpMethod: POST
    version: 1

  # Loki datasource
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
    version: 1

  # Alertmanager is visible from Grafana for silences and alert inspection.
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
    version: 1

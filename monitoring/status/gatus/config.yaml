storage:
  type: sqlite
  path: /data/gatus.db

web:
  port: 8080
  address: 0.0.0.0

ui:
  title: SIH Salus - Estado local
  header: Estado local del establecimiento
  logo: ""
  link: /openmrs/spa
  buttons:
    - name: OpenMRS
      link: /openmrs/spa

metrics: true

endpoints:
  - name: Sistema web
    group: Atencion local
    url: https://gateway/health
    interval: 30s
    client:
      # The gateway uses the host's private self-signed certificate. Traffic is
      # still encrypted; hostname verification is disabled only for this
      # isolated Docker-network probe because "gateway" is not a certificate SAN.
      insecure: true
    conditions:
      - "[STATUS] == 200"

  - name: Backend arrancado
    group: Atencion local
    url: https://gateway/startup
    interval: 30s
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"

  - name: Atencion clinica
    group: Atencion local
    url: https://gateway/ready
    interval: 30s
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"

  - name: OpenMRS iniciado
    group: Atencion local
    url: http://backend:8080/openmrs/health/started
    interval: 30s
    conditions:
      - "[STATUS] == 200"

  - name: Frontend disponible
    group: Atencion local
    # initializeSpa lives in the external bootstrap after CSP hardening; the
    # index HTML intentionally no longer contains inline executable code.
    url: http://frontend/sihsalus-spa-bootstrap.js
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*initializeSpa*)"

  - name: Sesion OpenMRS
    group: Atencion local
    url: http://backend:8080/openmrs/ws/rest/v1/session
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: Gateway publico
    group: Red local
    url: https://gateway/openmrs/spa/home
    interval: 60s
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"

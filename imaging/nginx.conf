server {
  listen 80 default_server;
  listen [::]:80 default_server;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Study identifiers are in viewer query strings. Do not duplicate gateway
  # requests, including their query strings, in the default upstream log.
  access_log off;

  # Enable workers using SharedArrayBuffer in HTTPS or localhost contexts.
  # The viewer's scripts, fonts and DICOMweb requests stay on the same origin.
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Embedder-Policy require-corp always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header X-Content-Type-Options nosniff always;
  add_header Cache-Control "no-store" always;

  # Missing static files must fail as 404, never return the SPA HTML with 200.
  location ~* \.(?:js|mjs|css|wasm|json|map|png|jpe?g|gif|svg|ico|woff2?|ttf|otf)$ {
    try_files $uri =404;
  }

  # Gateway removes /imaging/ exactly once; history routes use the same shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

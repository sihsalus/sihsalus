name: CI

on:
  push:
    branches: [main, pre-release]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_omods:
        description: Run the full source-module test matrix
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect scoped changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      web: ${{ steps.scope.outputs.web }}
      monitoring: ${{ steps.scope.outputs.monitoring }}
      grafana_oidc: ${{ steps.scope.outputs.grafana_oidc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect scoped changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          backend=true
          if [ "$EVENT_NAME" != "workflow_dispatch" ] \
            && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            && git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
              .github/workflows/ci.yml .dockerignore pom.xml backend/ tests/backend/ scripts/security/; then
            backend=false
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          web=true
          if [ "$EVENT_NAME" != "workflow_dispatch" ] \
            && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            && git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
              .github/workflows/ci.yml docker-bake.hcl compose/core.yml .env.template \
              frontend/ gateway/ tests/frontend/cache-policy.sh tests/gateway/; then
            web=false
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          monitoring=true
          if [ "$EVENT_NAME" != "workflow_dispatch" ] \
            && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            && git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
              .github/workflows/ci.yml docker-compose.yml compose/monitoring.yml compose/status.yml \
              monitoring/ tests/monitoring/ scripts/utils/viewpower.service; then
            monitoring=false
          fi
          echo "monitoring=$monitoring" >> "$GITHUB_OUTPUT"
          grafana_oidc=true
          if [ "$EVENT_NAME" != "workflow_dispatch" ] \
            && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            && git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
              .github/workflows/ci.yml docker-compose.yml compose/core.yml \
              compose/monitoring.yml compose/monitoring-oidc.yml compose/keycloak.yml \
              oauth/ tests/monitoring/oidc/ scripts/validate-compose.sh \
              scripts/security-audit.sh scripts/security/ .env.template; then
            grafana_oidc=false
          fi
          echo "grafana_oidc=$grafana_oidc" >> "$GITHUB_OUTPUT"

  release-manifests:
    name: Release manifests
    uses: ./.github/workflows/release-manifests.yml

  compose:
    name: Validate Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run focused configuration, deployment, security and monitoring tests
        run: bash tests/run.sh

      - name: Validate models and invariants
        run: ./scripts/validate-compose.sh compose-validation

      - name: Write validation summary
        if: always()
        run: |
          {
            echo "## Compose validation evidence"
            echo ""
            echo "| Target | Evidence file |"
            echo "| --- | --- |"
            for file in compose-validation/*.json; do
              [ -f "$file" ] || continue
              name="$(basename "$file" .json)"
              echo "| ${name} | ${file} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Compose evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: compose-validation
          path: compose-validation/
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Web routing and cache
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify frontend cache policy
        run: bash tests/frontend/cache-policy.sh
      - name: Verify HTTP and HTTPS gateway routes
        run: python3 tests/gateway/routing.py

  monitoring:
    name: Monitoring configuration and Docker API proxy
    needs: changes
    if: needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify read-only Docker API
        run: bash tests/monitoring/socket-proxy.sh
      - name: Validate monitoring configurations and VPN failover alerts
        run: bash tests/monitoring/config-validation.sh

  grafana-oidc:
    name: Grafana OIDC authorization
    needs: changes
    if: needs.changes.outputs.grafana_oidc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Grafana OIDC configuration and fixture contracts
        run: python3 -B -m unittest discover -s tests/monitoring/oidc -p 'test_*.py' -v
      - name: Exercise Grafana logins, roles, denial and logout
        run: python3 -B tests/monitoring/oidc/runtime.py runtime

  source-omods:
    name: Test source OMODs
    if: github.event_name == 'workflow_dispatch' && inputs.source_omods
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        module: [initializer, queue, reporting, reportingrest, patientdocuments, billing, fhir2, authentication, oauth2login, sihsalusaudit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Use the JDK supported by each upstream test stack.
          java-version: ${{ matrix.module == 'initializer' && '11' || matrix.module == 'oauth2login' && '8' || '21' }}
          cache: maven
          cache-dependency-path: backend/omod-sources.lock
      - name: Build and test the pinned module
        env:
          OMOD_TEST_REPORTS: ${{ runner.temp }}/omod-tests
        run: bash backend/bin/build-source-omods.sh test '${{ matrix.module }}'
      - name: Set up Java 21 for Initializer Core 2.8 integration tests
        if: matrix.module == 'initializer'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Test Initializer against Core 2.8 on Java 21
        if: matrix.module == 'initializer'
        env:
          OMOD_TEST_REPORTS: ${{ runner.temp }}/omod-core28-java21-tests
        run: bash backend/bin/build-source-omods.sh test-core28 initializer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: omod-tests-${{ matrix.module }}
          path: |
            ${{ runner.temp }}/omod-tests/
            ${{ runner.temp }}/omod-core28-java21-tests/
          if-no-files-found: warn

  backend:
    name: Build backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: docker/setup-buildx-action@v4

      - name: Build deployable backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: sihsalus-backend:ci
          build-args: SECURITY_REFRESH=${{ github.sha }}
          cache-from: type=gha,scope=backend-omod-refresh
          cache-to: type=gha,scope=backend-omod-refresh,mode=max

      - name: Test backend OCL token contract
        run: ./tests/backend/ocl-token-image.sh sihsalus-backend:ci

      - name: Verify packaged versions, owned release bytes and compiled protections
        run: bash tests/backend/source-omods-image.sh sihsalus-backend:ci

      - name: Verify published O3 Forms bytes in backend image
        run: bash tests/backend/o3forms-release-image.sh sihsalus-backend:ci

      - name: Verify required OMOD dependency compatibility with packaged Core
        run: bash tests/backend/module-dependencies-image.sh sihsalus-backend:ci

      - name: Test backend forced-password contract
        run: ./tests/backend/forced-password-image.sh sihsalus-backend:ci

      - name: Test backend Tomcat configuration directory permissions
        run: bash tests/backend/tomcat-config-image.sh sihsalus-backend:ci

      - name: Resolve pinned OpenMRS security baseline
        id: openmrs-baseline
        run: |
          set -euo pipefail
          baseline_image="$(sed -n 's/^ARG OPENMRS_RUNTIME_IMAGE=//p' backend/Dockerfile)"
          if [[ ! "${baseline_image}" =~ ^openmrs/openmrs-core:[a-zA-Z0-9._-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The OpenMRS runtime baseline is not pinned to an immutable digest."
            exit 1
          fi
          echo "image=${baseline_image}" >>"${GITHUB_OUTPUT}"

      - name: Scan backend candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scanners: vuln
          image-ref: sihsalus-backend:ci
          format: json
          output: trivy-backend-candidate.json
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Scan pinned OpenMRS baseline
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scanners: vuln
          image-ref: ${{ steps.openmrs-baseline.outputs.image }}
          format: json
          output: trivy-openmrs-baseline.json
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Enforce backend vulnerability ratchet
        run: bash scripts/security/check-backend-vulnerabilities.sh trivy-backend-candidate.json trivy-openmrs-baseline.json

      - name: Produce backend Trivy evidence
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scanners: vuln
          image-ref: sihsalus-backend:ci
          format: sarif
          output: trivy-backend-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          limit-severities-for-sarif: true

      - name: Upload backend Trivy evidence
        if: ${{ always() && hashFiles('trivy-backend-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend

  gate:
    name: PR Gate
    if: always()
    needs: [changes, compose, release-manifests, web, monitoring, grafana-oidc, source-omods, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validations
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          MANIFEST_RESULT: ${{ needs.release-manifests.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          OMOD_RESULT: ${{ needs.source-omods.result }}
          WEB_RESULT: ${{ needs.web.result }}
          MONITORING_RESULT: ${{ needs.monitoring.result }}
          GRAFANA_RESULT: ${{ needs.grafana-oidc.result }}
        run: |
          [ "$CHANGES_RESULT" = "success" ]
          [ "$COMPOSE_RESULT" = "success" ]
          [ "$MANIFEST_RESULT" = "success" ]
          [ "$OMOD_RESULT" = "success" ] || [ "$OMOD_RESULT" = "skipped" ]
          [ "$BACKEND_RESULT" = "success" ] || [ "$BACKEND_RESULT" = "skipped" ]
          [ "$WEB_RESULT" = "success" ] || [ "$WEB_RESULT" = "skipped" ]
          [ "$MONITORING_RESULT" = "success" ] || [ "$MONITORING_RESULT" = "skipped" ]
          [ "$GRAFANA_RESULT" = "success" ] || [ "$GRAFANA_RESULT" = "skipped" ]

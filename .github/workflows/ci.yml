name: CI

on:
  push:
    branches: [main, pre-release]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      backup: ${{ steps.scope.outputs.backup }}
      monitoring: ${{ steps.scope.outputs.monitoring }}
      imaging: ${{ steps.scope.outputs.imaging }}
      grafana_oidc: ${{ steps.scope.outputs.grafana_oidc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect scoped changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          backend=true
          backup=true
          monitoring=true
          imaging=true
          grafana_oidc=true

          can_diff=false
          if [ "$EVENT_NAME" != "workflow_dispatch" ] \
            && [ -n "$BASE_SHA" ] \
            && [[ ! "$BASE_SHA" =~ ^0+$ ]] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            can_diff=true
          fi

          if [ "$can_diff" = "true" ] \
            && git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- .github/workflows/ci.yml pom.xml backend/ tests/backend/; then
            backend=false
          fi

          if [ "$can_diff" = "true" ] \
            && git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- .github/workflows/ci.yml compose/seed.yml scripts/backup/ scripts/seed/ tests/backup/ tests/seed/; then
            backup=false
          fi

          if [ "$can_diff" = "true" ] \
            && git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- .github/workflows/ci.yml compose/monitoring.yml monitoring/ tests/monitoring/; then
            monitoring=false
          fi

          if [ "$can_diff" = "true" ] \
            && git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- .github/workflows/ci.yml compose/core.yml compose/keycloak.yml compose/imaging-auth.yml gateway/ keycloak/ tests/imaging/; then
            imaging=false
          fi

          if [ "$can_diff" = "true" ] \
            && git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- .github/workflows/ci.yml compose/monitoring.yml compose/monitoring-oidc.yml compose/keycloak.yml tests/monitoring/oidc/ scripts/validate-compose.sh scripts/security-audit.sh scripts/security/ .env.template; then
            grafana_oidc=false
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "backup=$backup" >> "$GITHUB_OUTPUT"
          echo "monitoring=$monitoring" >> "$GITHUB_OUTPUT"
          echo "imaging=$imaging" >> "$GITHUB_OUTPUT"
          echo "Backend build required: $backend"
          echo "Backup round-trip required: $backup"
          echo "Monitoring runtime test required: $monitoring"
          echo "Imaging auth runtime test required: $imaging"
          echo "Grafana OIDC runtime test required: $grafana_oidc"
          echo "grafana_oidc=$grafana_oidc" >> "$GITHUB_OUTPUT"

  compose:
    name: Validate Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test frontend bootstrap configuration
        run: node --test frontend/patch-config-urls.test.js

      - name: Test frontend cache policy
        run: ./tests/frontend/cache-policy.sh

      - name: Test frontend deployment and rollback
        run: ./tests/frontend/deploy-frontend.sh

      - name: Test guarded poweroff policy
        run: ./tests/utils/safe-poweroff-policy.sh

      - name: Test split-brain-resistant external verification
        run: ./tests/deploy/verify-external-frontend-test.sh

      - name: Validate full environment redeploy policy
        run: ./tests/deploy/redeploy-environment-policy.sh

      - name: Test OCL token runtime configuration
        run: ./tests/backend/ocl-token-config.sh

      - name: Test forced-password runtime configuration
        run: ./tests/backend/forced-password-config.sh

      - name: Test realtime notifications OMOD and gateway configuration
        run: ./tests/backend/realtime-notifications-config.sh

      - name: Test HTTP and HTTPS gateway routing
        run: python3 tests/gateway/routing.py

      - name: Test backend security refresh cache policy
        run: ./tests/backend/security-refresh-config.sh

      - name: Validate models and invariants
        run: ./scripts/validate-compose.sh compose-validation

      - name: Write validation summary
        if: always()
        run: |
          {
            echo "## Compose validation evidence"
            echo ""
            echo "| Target | Evidence file |"
            echo "| --- | --- |"
            for file in compose-validation/*.json; do
              [ -f "$file" ] || continue
              name="$(basename "$file" .json)"
              echo "| ${name} | ${file} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Compose evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: compose-validation
          path: compose-validation/
          if-no-files-found: warn
          retention-days: 14

  source-omods:
    name: Test source OMOD (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        module: [webservices.rest, initializer, queue, reporting, reportingrest, patientdocuments, billing, emrapi, fhir2, authentication]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Initializer also tests Core 2.1-era XStream; upstream supports Java 8/11.
          java-version: ${{ matrix.module == 'initializer' && '11' || '21' }}
          cache: maven
          cache-dependency-path: backend/omod-sources.lock
      - name: Build and test the pinned module
        env:
          OMOD_TEST_REPORTS: ${{ runner.temp }}/omod-tests
        run: bash backend/bin/build-source-omods.sh test '${{ matrix.module }}'
      - name: Set up Java 21 for Initializer Core 2.8 integration tests
        if: matrix.module == 'initializer'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Test Initializer against Core 2.8 on Java 21
        if: matrix.module == 'initializer'
        env:
          OMOD_TEST_REPORTS: ${{ runner.temp }}/omod-core28-java21-tests
        run: bash backend/bin/build-source-omods.sh test-core28 initializer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: omod-tests-${{ matrix.module }}
          path: |
            ${{ runner.temp }}/omod-tests/
            ${{ runner.temp }}/omod-core28-java21-tests/
          if-no-files-found: warn

  backend:
    name: Build backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@v4

      - name: Build deployable backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: sihsalus-backend:ci
          build-args: SECURITY_REFRESH=${{ github.sha }}
          cache-from: type=gha,scope=backend-omod-refresh
          cache-to: type=gha,scope=backend-omod-refresh,mode=max

      - name: Test backend OCL token contract
        run: ./tests/backend/ocl-token-image.sh sihsalus-backend:ci

      - name: Verify all packaged OMOD versions and REST security patch
        run: bash tests/backend/source-omods-image.sh sihsalus-backend:ci

      - name: Test backend forced-password contract
        run: ./tests/backend/forced-password-image.sh sihsalus-backend:ci

      - name: Resolve pinned OpenMRS security baseline
        id: openmrs-baseline
        run: |
          set -euo pipefail
          baseline_image="$(sed -n 's/^ARG OPENMRS_RUNTIME_IMAGE=//p' backend/Dockerfile)"
          if [[ ! "${baseline_image}" =~ ^openmrs/openmrs-core:[a-zA-Z0-9._-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The OpenMRS runtime baseline is not pinned to an immutable digest."
            exit 1
          fi
          echo "image=${baseline_image}" >>"${GITHUB_OUTPUT}"

      - name: Scan backend candidate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sihsalus-backend:ci
          format: json
          output: trivy-backend-candidate.json
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Scan pinned OpenMRS baseline
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.openmrs-baseline.outputs.image }}
          format: json
          output: trivy-openmrs-baseline.json
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Enforce backend vulnerability ratchet
        run: |
          set -euo pipefail
          candidate_total="$(jq '[.Results[]? | (.Vulnerabilities // [])[]] | length' trivy-backend-candidate.json)"
          baseline_total="$(jq '[.Results[]? | (.Vulnerabilities // [])[]] | length' trivy-openmrs-baseline.json)"
          candidate_os="$(jq '[.Results[]? | select(.Class == "os-pkgs") | (.Vulnerabilities // [])[]] | length' trivy-backend-candidate.json)"
          unexpected="$(
            jq -n \
              --slurpfile candidate trivy-backend-candidate.json \
              --slurpfile baseline trivy-openmrs-baseline.json \
              'def findings($report):
                 [$report[0].Results[]? | (.Vulnerabilities // [])[] |
                  "\(.VulnerabilityID)|\(.PkgName)|\(.InstalledVersion)"] | unique;
               findings($candidate) - findings($baseline)'
          )"
          unexpected_total="$(jq 'length' <<<"${unexpected}")"

          {
            echo '### Backend vulnerability ratchet'
            echo "- Candidate HIGH/CRITICAL findings: ${candidate_total}"
            echo "- Upstream OpenMRS baseline findings: ${baseline_total}"
            echo "- Candidate OS findings with fixes: ${candidate_os}"
            echo "- Findings added beyond upstream: ${unexpected_total}"
          } >>"${GITHUB_STEP_SUMMARY}"

          if [[ "${candidate_os}" != '0' ]]; then
            echo '::error::The backend still contains fixable HIGH/CRITICAL operating-system vulnerabilities.'
            jq -r '.Results[]? | select(.Class == "os-pkgs") | (.Vulnerabilities // [])[] |
              "\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)"' \
              trivy-backend-candidate.json
            exit 1
          fi

          if [[ "${unexpected_total}" != '0' ]]; then
            echo '::error::The SIHSALUS backend adds HIGH/CRITICAL vulnerabilities beyond its pinned OpenMRS base.'
            jq -r '.[]' <<<"${unexpected}"
            exit 1
          fi

      - name: Produce backend Trivy evidence
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sihsalus-backend:ci
          format: sarif
          output: trivy-backend-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          limit-severities-for-sarif: true

      - name: Upload backend Trivy evidence
        if: ${{ always() && hashFiles('trivy-backend-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend

  backup:
    name: Backup round-trip
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test encrypted dump and restore
        run: ./tests/backup/dump-roundtrip.sh

      - name: Test encrypted seed restore
        run: ./tests/seed/roundtrip.sh

  monitoring:
    name: Docker API proxy
    needs: changes
    if: needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify read-only Docker API
        run: ./tests/monitoring/socket-proxy.sh

      - name: Validate monitoring configurations
        run: ./tests/monitoring/config-validation.sh

  imaging:
    name: Imaging authorization
    needs: changes
    if: needs.changes.outputs.imaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test anonymous denial, authorized access and logout
        run: ./tests/imaging/auth-gateway.sh

  grafana-oidc:
    name: Grafana OIDC authorization
    needs: changes
    if: needs.changes.outputs.grafana_oidc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test synthetic provider and configuration contracts
        run: python3 -B -m unittest discover -s tests/monitoring/oidc -p 'test_*.py' -v
      - name: Test real Grafana roles, denied login, expired code and logout
        run: python3 -B tests/monitoring/oidc/runtime.py runtime

  gate:
    name: PR Gate
    if: always()
    needs: [compose, source-omods, backend, backup, monitoring, imaging, grafana-oidc]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validations
        env:
          COMPOSE_RESULT: ${{ needs.compose.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          OMOD_RESULT: ${{ needs.source-omods.result }}
          BACKUP_RESULT: ${{ needs.backup.result }}
          MONITORING_RESULT: ${{ needs.monitoring.result }}
          IMAGING_RESULT: ${{ needs.imaging.result }}
          GRAFANA_OIDC_RESULT: ${{ needs.grafana-oidc.result }}
        run: |
          [ "$COMPOSE_RESULT" = "success" ]
          [ "$OMOD_RESULT" = "success" ] || [ "$OMOD_RESULT" = "skipped" ]
          [ "$BACKEND_RESULT" = "success" ] || [ "$BACKEND_RESULT" = "skipped" ]
          [ "$BACKUP_RESULT" = "success" ] || [ "$BACKUP_RESULT" = "skipped" ]
          [ "$MONITORING_RESULT" = "success" ] || [ "$MONITORING_RESULT" = "skipped" ]
          [ "$IMAGING_RESULT" = "success" ] || [ "$IMAGING_RESULT" = "skipped" ]
          [ "$GRAFANA_OIDC_RESULT" = "success" ] || [ "$GRAFANA_OIDC_RESULT" = "skipped" ]

name: Terminology service images

on:
  push:
    branches: [main, feature/terminology-deployment]
    paths: [compose/terminology.yml, .github/workflows/terminology-images.yml]
  pull_request:
    paths: [compose/terminology.yml, .github/workflows/terminology-images.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.74.0
          cache: true
      - name: Scan pinned infrastructure images
        run: |
          bash scripts/security/secrets_generate.sh "$RUNNER_TEMP/terminology.env" terminology
          export TERMINOLOGY_HOST=terminology.example.org
          export TERMINOLOGY_API_IMAGE=ghcr.io/sihsalus/terminology-api:scan-render-only
          export TERMINOLOGY_WEB_IMAGE=ghcr.io/sihsalus/terminology-web:scan-render-only
          docker compose --env-file "$RUNNER_TEMP/terminology.env" -f docker-compose.terminology.yml config --format json > "$RUNNER_TEMP/terminology.json"
          mkdir reports
          failed=0
          for service in db redis es storage; do
            image=$(jq -r --arg service "$service" '.services[$service].image' "$RUNNER_TEMP/terminology.json")
            trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output "reports/$service.json" "$image" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: terminology-service-security
          path: reports/
          if-no-files-found: error

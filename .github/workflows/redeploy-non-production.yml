name: Redeploy Non-Production

on:
  workflow_dispatch:
    inputs:
      confirm_full_redeploy:
        description: Recreate every active service in DEV and QLTY while preserving volumes
        required: true
        default: false
        type: boolean
      backend_sha:
        description: Backend source commit (40 lowercase hexadecimal characters)
        required: true
        type: string
      backend_digest:
        description: 'Immutable backend image digest (sha256: followed by 64 lowercase hexadecimal characters)'
        required: true
        type: string

concurrency:
  group: redeploy-non-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Clean redeploy DEV
    if: inputs.confirm_full_redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REDEPLOY_EXPECTED_REMOTE_MAC: '00:0c:29:ad:be:90'
      REDEPLOY_EXPECTED_NODE_ID: '3eb58bb0-ff08-4e2d-839c-11cedca0b043'
      REDEPLOY_TIMEOUT_SECONDS: '3000'
    environment:
      name: development
      url: https://gidis-hsc-dev.inf.pucp.edu.pe/openmrs/spa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate redeploy policy
        run: ./tests/deploy/redeploy-environment-policy.sh

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS_DEV }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_KEY}" >"${HOME}/.ssh/deploy_key"
          printf '%s\n' "${KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/deploy_key" "${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${HOME}/.ssh/deploy_key" >/dev/null

      - name: Redeploy every active service
        id: redeploy
        env:
          TARGET_BACKEND_SHA: ${{ inputs.backend_sha }}
          TARGET_BACKEND_DIGEST: ${{ inputs.backend_digest }}
        run: |
          set -euo pipefail
          if [[ ! "${TARGET_BACKEND_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The requested backend SHA is invalid."
            exit 2
          fi
          if [[ ! "${TARGET_BACKEND_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The requested backend digest is invalid."
            exit 2
          fi
          redeploy_output="${RUNNER_TEMP}/sihsalus-redeploy-dev.log"
          scripts/deploy/run-redeploy-remote.sh \
            "${HOME}/.ssh/deploy_key" \
            u.hsc.dev@200.16.7.137 \
            /home/u.hsc.dev/sihsalus \
            "${TARGET_BACKEND_SHA}" \
            "${TARGET_BACKEND_DIGEST}" \
            "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-dev" |
            tee "${redeploy_output}"
          frontend_sha="$(
            sed -n 's/^\[redeploy-environment\] frontend=\([0-9a-f]\{40\}\)$/\1/p' \
              "${redeploy_output}" |
              tail -n 1
          )"
          if [[ ! "${frontend_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The redeploy did not report a valid frontend SHA."
            exit 1
          fi
          echo "frontend_sha=${frontend_sha}" >>"${GITHUB_OUTPUT}"

      - name: Verify DEV externally
        env:
          TARGET_SHA: ${{ steps.redeploy.outputs.frontend_sha }}
        run: |
          set -euo pipefail
          base='https://gidis-hsc-dev.inf.pucp.edu.pe'
          scripts/deploy/verify-external-frontend.sh \
            "${base}" "${TARGET_SHA}" "${REDEPLOY_EXPECTED_NODE_ID}" DEV
          curl --insecure --fail --silent --show-error \
            "${base}/openmrs/spa/sihsalus-spa-bootstrap.js" |
            grep -q 'initializeSpa'
          csp="$(curl --insecure --fail --silent --show-error --head "${base}/openmrs/spa/" |
            awk 'BEGIN { IGNORECASE=1 } /^content-security-policy:/ { sub(/\r$/, ""); print; exit }')"
          grep -Fq "script-src 'self';" <<<"${csp}"
          if grep -Fq "script-src 'self' 'unsafe-inline'" <<<"${csp}"; then
            echo "DEV still permits inline SPA scripts" >&2
            exit 1
          fi

  deploy-qlty:
    name: Clean redeploy QLTY
    if: inputs.confirm_full_redeploy
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REDEPLOY_EXPECTED_REMOTE_MAC: '00:0c:29:1c:f7:78'
      REDEPLOY_EXPECTED_NODE_ID: '0cefb0c8-c860-48c5-856f-408594775cbb'
      REDEPLOY_TIMEOUT_SECONDS: '3000'
    environment:
      name: quality
      url: https://gidis-hsc-qlty.inf.pucp.edu.pe/openmrs/spa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate redeploy policy
        run: ./tests/deploy/redeploy-environment-policy.sh

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY_QLTY }}
          KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS_QLTY }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_KEY}" >"${HOME}/.ssh/deploy_key"
          printf '%s\n' "${KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/deploy_key" "${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${HOME}/.ssh/deploy_key" >/dev/null

      - name: Redeploy every active service
        id: redeploy
        env:
          TARGET_BACKEND_SHA: ${{ inputs.backend_sha }}
          TARGET_BACKEND_DIGEST: ${{ inputs.backend_digest }}
        run: |
          set -euo pipefail
          if [[ ! "${TARGET_BACKEND_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The requested backend SHA is invalid."
            exit 2
          fi
          if [[ ! "${TARGET_BACKEND_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The requested backend digest is invalid."
            exit 2
          fi
          redeploy_output="${RUNNER_TEMP}/sihsalus-redeploy-qlty.log"
          scripts/deploy/run-redeploy-remote.sh \
            "${HOME}/.ssh/deploy_key" \
            u.hsc.qlty@200.16.7.138 \
            /home/u.hsc.qlty/sihsalus \
            "${TARGET_BACKEND_SHA}" \
            "${TARGET_BACKEND_DIGEST}" \
            "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-qlty" |
            tee "${redeploy_output}"
          frontend_sha="$(
            sed -n 's/^\[redeploy-environment\] frontend=\([0-9a-f]\{40\}\)$/\1/p' \
              "${redeploy_output}" |
              tail -n 1
          )"
          if [[ ! "${frontend_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The redeploy did not report a valid frontend SHA."
            exit 1
          fi
          echo "frontend_sha=${frontend_sha}" >>"${GITHUB_OUTPUT}"

      - name: Verify QLTY externally
        env:
          TARGET_SHA: ${{ steps.redeploy.outputs.frontend_sha }}
        run: |
          set -euo pipefail
          base='https://gidis-hsc-qlty.inf.pucp.edu.pe'
          scripts/deploy/verify-external-frontend.sh \
            "${base}" "${TARGET_SHA}" "${REDEPLOY_EXPECTED_NODE_ID}" QLTY
          curl --insecure --fail --silent --show-error \
            "${base}/openmrs/spa/sihsalus-spa-bootstrap.js" |
            grep -q 'initializeSpa'
          csp="$(curl --insecure --fail --silent --show-error --head "${base}/openmrs/spa/" |
            awk 'BEGIN { IGNORECASE=1 } /^content-security-policy:/ { sub(/\r$/, ""); print; exit }')"
          grep -Fq "script-src 'self';" <<<"${csp}"
          if grep -Fq "script-src 'self' 'unsafe-inline'" <<<"${csp}"; then
            echo "QLTY still permits inline SPA scripts" >&2
            exit 1
          fi

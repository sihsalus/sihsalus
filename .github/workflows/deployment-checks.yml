name: Deployment checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Deployment identity and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify Compose coverage and persistent release selection
        run: python3 -B tests/deploy/release-manifest-compose.py --audit
      - name: Verify metadata from unlabeled and labeled runtime images
        run: python3 -B tests/deploy/release-manifest-images.py

  backend-security-rescan:
    name: Rescan the signed FUA 1.0.92 backend
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BACKEND_IMAGE: ghcr.io/sihsalus/sihsalus-backend@sha256:c06868be246ab12361011aba7a957d64e29c99531aac2ed82ad2da2883b470e0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Verify the official backend publisher signature
        run: |
          set -euo pipefail
          cosign verify "$BACKEND_IMAGE" \
            --certificate-identity 'https://github.com/sihsalus/sihsalus/.github/workflows/build-backend.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
      - name: Refresh immutable backend security evidence
        uses: ./.github/actions/check-image
        with:
          image: ${{ env.BACKEND_IMAGE }}
          source: 1b784d40c043a40e299732024cd5ce7ef640bce9
          artifact-name: backend-image-security-rescan-c06868be-${{ github.run_id }}-${{ github.run_attempt }}

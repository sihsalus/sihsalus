name: Build Gateway

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gateway.yml'
      - '.github/actions/check-image/**'
      - 'scripts/security/image-policy.py'
      - 'scripts/security/image-tool.py'
      - 'scripts/security/scan-image.sh'
      - 'scripts/security/promote-image.sh'
      - 'security/image-exceptions.json'
      - 'gateway/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build and Publish Gateway Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate current exception policy
        run: python3 scripts/security/image-policy.py check-policy security/image-exceptions.json

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/sihsalus/sihsalus-gateway
          tags: |
            type=sha,prefix=sha-,format=long

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ./gateway
          push: true
          tags: ghcr.io/sihsalus/sihsalus-gateway:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

      - name: Require attested and scanned gateway digest
        uses: ./.github/actions/check-image
        with:
          image: ghcr.io/sihsalus/sihsalus-gateway@${{ steps.build.outputs.digest }}
          source: ${{ github.sha }}
          artifact-name: gateway-image-security-${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/sihsalus/sihsalus-gateway@${DIGEST}"

      - name: Publish verified release aliases
        env:
          IMAGE: ghcr.io/sihsalus/sihsalus-gateway@${{ steps.build.outputs.digest }}
          PROMOTE_LATEST: ${{ github.ref == 'refs/heads/main' }}
        run: bash scripts/security/promote-image.sh "$IMAGE" "$GITHUB_SHA" "$PROMOTE_LATEST"

      - name: Make package public
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/sihsalus/packages/container/sihsalus-gateway" \
            -d '{"visibility":"public"}'

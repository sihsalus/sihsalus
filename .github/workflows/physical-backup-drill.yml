name: Backup and restore drills

on:
  schedule:
    - cron: '41 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dump:
    name: Encrypted SQL dump and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the restored synthetic row
        run: bash tests/backup/dump-roundtrip.sh

  seed:
    name: Encrypted seed restore and rejection cases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify seed contents, checksums and destination protection
        run: bash tests/seed/roundtrip.sh

  restore:
    name: Encrypted physical restore and snapshot rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise the existing physical backup and restore scripts
        run: bash tests/backup/physical-roundtrip.sh

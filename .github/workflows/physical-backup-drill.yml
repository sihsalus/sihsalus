name: Physical backup restore drill

on:
  schedule:
    - cron: '41 9 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/physical-backup-drill.yml'
      - 'scripts/backup/backup_full.sh'
      - 'scripts/backup/restore_full.sh'
      - 'tests/backup/physical-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore:
    name: Encrypted physical restore and snapshot rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise the existing physical backup and restore scripts
        run: bash tests/backup/physical-roundtrip.sh

name: Build Backend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-backend.yml'
      - 'pom.xml'
      - 'backend/**'
      - 'tests/backend/ocl-token-image.sh'
      - 'tests/backend/forced-password-image.sh'
      - 'tests/backend/tomcat-config-config.sh'
      - 'tests/backend/tomcat-config-image.sh'
      - 'tests/backend/o3forms-release-config.sh'
      - 'tests/backend/o3forms-release-image.sh'
      - 'tests/backend/owned-module-releases.py'
      - 'tests/backend/source-omods-image.sh'
      - 'tests/backend/module-dependencies-image.sh'
      - 'tests/backend/ModuleDependencyVerifier.java'
      - 'tests/backend/vulnerability-ratchet.sh'
      - 'tests/backend/vulnerability-ratchet-config.sh'
      - 'tests/backend/build-backend-config.sh'
  workflow_dispatch:
    inputs:
      mode:
        description: Build a new image or verify an already published immutable candidate
        type: choice
        options: [build, verify-existing]
        default: build
      source_sha:
        description: 'verify-existing only: full lowercase source commit SHA'
        type: string
        required: false
      image_digest:
        description: 'verify-existing only: sha256 followed by a colon and 64 lowercase hexadecimal characters'
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build and Publish Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write
    steps:
      - name: Validate backend workflow request
        id: request
        env:
          MODE: ${{ inputs.mode || 'build' }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != 'sihsalus/sihsalus' ]]; then
            echo '::error::Backend publication and verification require the canonical repository.'
            exit 1
          fi
          case "${MODE}" in
            build)
              if [[ -n "${SOURCE_SHA}" || -n "${IMAGE_DIGEST}" ]]; then
                echo '::error::Existing-image inputs require explicit verify-existing mode.'
                exit 1
              fi
              SOURCE_SHA="${GITHUB_SHA}"
              ;;
            verify-existing)
              if [[ "${GITHUB_EVENT_NAME}" != 'workflow_dispatch' \
                || "${GITHUB_REF}" != refs/heads/* || "${GITHUB_REF}" == 'refs/heads/main' ]]; then
                echo '::error::verify-existing requires a manual run on a non-main branch.'
                exit 1
              fi
              if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ \
                || ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo '::error::Provide both an immutable full source SHA and a full sha256 image digest.'
                exit 1
              fi
              ;;
            *)
              echo '::error::Unknown backend workflow mode.'
              exit 1
              ;;
          esac
          {
            echo "mode=${MODE}"
            echo "source_sha=${SOURCE_SHA}"
          } >>"${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ steps.request.outputs.mode == 'verify-existing' && '0' || '1' }}

      - name: Test backend workflow contract
        run: bash tests/backend/build-backend-config.sh

      - name: Check out the existing image source
        if: steps.request.outputs.mode == 'verify-existing'
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${SOURCE_SHA}^{commit}" \
            || ! git merge-base --is-ancestor "${SOURCE_SHA}" "${GITHUB_SHA}"; then
            echo '::error::The image source must be a commit in the workflow revision ancestry.'
            exit 1
          fi
          git checkout --detach "${SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Validate published O3 Forms dependency contract
        run: |
          bash tests/backend/o3forms-release-config.sh
          bash tests/backend/o3forms-release-image.sh --self-test

      - name: Validate independently released REST and EMR API modules
        run: python3 tests/backend/owned-module-releases.py --self-test

      - name: Test Tomcat rootless configuration directory contract
        run: bash tests/backend/tomcat-config-config.sh

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/sihsalus/sihsalus-backend
          tags: |
            type=sha,prefix=sha-,format=long

      - uses: docker/build-push-action@v7
        id: build
        if: steps.request.outputs.mode == 'build'
        with:
          context: .
          file: backend/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/sihsalus/sihsalus-backend:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            SECURITY_REFRESH=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max,ignore-error=true

      - name: Verify existing immutable backend image
        id: reuse
        if: steps.request.outputs.mode == 'verify-existing'
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/sihsalus/sihsalus-backend@${IMAGE_DIGEST}"
          manifest_digest="$(docker buildx imagetools inspect "${image}" --format '{{.Manifest.Digest}}')"
          if [[ "${manifest_digest}" != "${IMAGE_DIGEST}" ]]; then
            echo '::error::The existing image manifest does not match the requested digest.'
            exit 1
          fi
          docker pull --platform linux/amd64 "${image}"
          platform="$(docker image inspect "${image}" --format '{{.Os}}/{{.Architecture}}')"
          revision="$(docker image inspect "${image}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          if [[ "${platform}" != 'linux/amd64' || "${revision}" != "${SOURCE_SHA}" ]]; then
            echo '::error::The existing image must be linux/amd64 and match its immutable source revision.'
            exit 1
          fi
          echo "digest=${IMAGE_DIGEST}" >>"${GITHUB_OUTPUT}"

      - name: Resolve backend image for verification
        id: image
        env:
          MODE: ${{ steps.request.outputs.mode }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          REUSE_DIGEST: ${{ steps.reuse.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "${MODE}" == 'verify-existing' ]]; then
            digest="${REUSE_DIGEST}"
          else
            digest="${BUILD_DIGEST}"
          fi
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::Verification requires a resolved immutable image digest.'
            exit 1
          fi
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
          {
            echo "Backend verification mode: ${MODE}"
            echo "Image source commit: ${SOURCE_SHA}"
            echo "Workflow commit: ${GITHUB_SHA}"
            echo "Image: ghcr.io/sihsalus/sihsalus-backend@${digest}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Test published backend OCL token contract
        env:
          IMAGE: ghcr.io/sihsalus/sihsalus-backend@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE}"
          ./tests/backend/ocl-token-image.sh "${IMAGE}"

      - name: Verify packaged versions, owned release bytes and compiled protections
        env:
          IMAGE: ghcr.io/sihsalus/sihsalus-backend@${{ steps.image.outputs.digest }}
        run: bash tests/backend/source-omods-image.sh "$IMAGE"

      - name: Verify published O3 Forms bytes in backend image
        env:
          IMAGE: ghcr.io/sihsalus/sihsalus-backend@${{ steps.image.outputs.digest }}
        run: bash tests/backend/o3forms-release-image.sh "$IMAGE"

      - name: Verify required OMOD dependency compatibility with packaged Core
        env:
          IMAGE: ghcr.io/sihsalus/sihsalus-backend@${{ steps.image.outputs.digest }}
        run: bash tests/backend/module-dependencies-image.sh "$IMAGE"

      - name: Test published backend forced-password contract
        env:
          IMAGE: ghcr.io/sihsalus/sihsalus-backend@${{ steps.image.outputs.digest }}
        run: ./tests/backend/forced-password-image.sh "${IMAGE}"

      - name: Test published backend Tomcat configuration directory permissions
        env:
          IMAGE: ghcr.io/sihsalus/sihsalus-backend@${{ steps.image.outputs.digest }}
        run: bash tests/backend/tomcat-config-image.sh "$IMAGE"

      - name: Resolve pinned OpenMRS security baseline
        id: openmrs-baseline
        run: |
          set -euo pipefail
          baseline_image="$(sed -n 's/^ARG OPENMRS_RUNTIME_IMAGE=//p' backend/Dockerfile)"
          if [[ ! "${baseline_image}" =~ ^openmrs/openmrs-core:[a-zA-Z0-9._-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The OpenMRS runtime baseline is not pinned to an immutable digest."
            exit 1
          fi
          echo "image=${baseline_image}" >>"${GITHUB_OUTPUT}"

      - name: Scan immutable backend candidate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/sihsalus/sihsalus-backend@${{ steps.image.outputs.digest }}
          format: json
          output: trivy-backend-candidate.json
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Scan pinned OpenMRS baseline
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.openmrs-baseline.outputs.image }}
          format: json
          output: trivy-openmrs-baseline.json
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Enforce backend vulnerability ratchet
        run: bash tests/backend/vulnerability-ratchet.sh trivy-backend-candidate.json trivy-openmrs-baseline.json

      - name: Produce backend Trivy evidence
        if: ${{ always() && steps.image.outcome == 'success' && steps.image.outputs.digest != '' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/sihsalus/sihsalus-backend@${{ steps.image.outputs.digest }}
          format: sarif
          output: trivy-backend-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          limit-severities-for-sarif: true

      - name: Upload backend Trivy evidence
        if: ${{ always() && hashFiles('trivy-backend-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/sihsalus/sihsalus-backend@${DIGEST}"

      - name: Promote verified backend image
        if: github.ref == 'refs/heads/main' && steps.request.outputs.mode == 'build'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image='ghcr.io/sihsalus/sihsalus-backend'
          docker buildx imagetools create --prefer-index=false --tag "${image}:latest" "${image}@${DIGEST}"
          promoted_digest="$(docker buildx imagetools inspect "${image}:latest" --format '{{.Manifest.Digest}}')"
          if [[ "${promoted_digest}" != "${DIGEST}" ]]; then
            echo "::error::The promoted backend alias does not resolve to the scanned digest."
            exit 1
          fi

      - name: Make package public
        if: steps.request.outputs.mode == 'build'
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/sihsalus/packages/container/sihsalus-backend" \
            -d '{"visibility":"public"}'

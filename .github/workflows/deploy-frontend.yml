name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published frontend version (latest or complete commit SHA)
        required: true
        default: latest
        type: string

concurrency:
  group: deploy-frontend-non-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  resolve:
    name: Resolve immutable frontend
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      digest: ${{ steps.release.outputs.digest }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require native human approval protections
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/deploy/check-human-review.sh development quality

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Resolve and verify release
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          image='ghcr.io/sihsalus/sihsalus-frontend'
          version="${REQUESTED_VERSION}"
          if [[ "$version" == latest ]]; then
            tag=latest
          elif [[ "$version" =~ ^[0-9a-f]{40}$ ]]; then
            tag="sha-$version"
          else
            echo "::error::Choose latest or a complete published commit SHA."
            exit 2
          fi
          immutable_json="$(docker buildx imagetools inspect "${image}:${tag}" --format '{{json .}}')"
          requested_sha="$(jq -r '.image.config.Labels["org.opencontainers.image.revision"] // empty' <<<"${immutable_json}")"
          immutable_digest="$(jq -r '.manifest.digest // empty' <<<"${immutable_json}")"
          if [[ ! "$requested_sha" =~ ^[0-9a-f]{40}$ || ! "$immutable_digest" =~ ^sha256:[0-9a-f]{64}$ ]] ||
             { [[ "$version" != latest ]] && [[ "$requested_sha" != "$version" ]]; }; then
            echo "::error::Published image has invalid or mismatched release metadata."
            exit 1
          fi
          tag="sha-$requested_sha"
          published_digest="$(docker buildx imagetools inspect "${image}:${tag}" --format '{{.Manifest.Digest}}')"
          if [[ "$published_digest" != "$immutable_digest" ]]; then
            echo "::error::Published version changed during selection; retry."
            exit 1
          fi

          {
            echo "sha=${requested_sha}"
            echo "digest=${immutable_digest}"
            echo "tag=${tag}"
          } >>"${GITHUB_OUTPUT}"

          echo "Resolved ${tag} at ${immutable_digest}"
          {
            echo '## Selection awaiting human deployment approval'
            echo "Operational checkout: ${GITHUB_SHA}"
            echo "Frontend commit: ${requested_sha}"
            echo "Immutable source: ${image}@${immutable_digest}"
            echo 'Targets: DEV (development), then QLTY (quality); approve each environment job separately.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Deploy DEV
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      REDEPLOY_EXPECTED_REMOTE_MAC: '00:0c:29:86:a3:3b'
      REDEPLOY_EXPECTED_NODE_ID: '700e430a-1c32-5241-b7cf-78ccea17f8c1'
    environment:
      name: development
      url: https://gidis-hsc-dev.inf.pucp.edu.pe/openmrs/spa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS_DEV }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_KEY}" >"${HOME}/.ssh/deploy_key"
          printf '%s\n' "${KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/deploy_key" "${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${HOME}/.ssh/deploy_key" >/dev/null

      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy/deploy-frontend.sh
          bash -n scripts/deploy/run-redeploy-remote.sh
          bash -n scripts/deploy/verify-external-frontend.sh

      - name: Deploy verified frontend
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          TARGET_DIGEST: ${{ needs.resolve.outputs.digest }}
        run: |
          set -euo pipefail
          REDEPLOY_SCRIPT_PATH=scripts/deploy/deploy-frontend.sh \
            REDEPLOY_TIMEOUT_SECONDS=4200 \
            scripts/deploy/run-redeploy-remote.sh \
            "${HOME}/.ssh/deploy_key" \
            u.hsc.dev@200.16.7.137 \
            /home/u.hsc.dev/sihsalus \
            "${TARGET_SHA}" \
            "${TARGET_DIGEST}" \
            "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-frontend-dev"

      - name: Verify DEV externally
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          scripts/deploy/verify-external-frontend.sh \
            https://gidis-hsc-dev.inf.pucp.edu.pe \
            "${TARGET_SHA}" \
            "${REDEPLOY_EXPECTED_NODE_ID}" \
            DEV

  deploy-qlty:
    name: Deploy QLTY
    needs: [resolve, deploy-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      REDEPLOY_EXPECTED_REMOTE_MAC: '00:0c:29:1c:f7:78'
      REDEPLOY_EXPECTED_NODE_ID: '0cefb0c8-c860-48c5-856f-408594775cbb'
    environment:
      name: quality
      url: https://gidis-hsc-qlty.inf.pucp.edu.pe/openmrs/spa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY_QLTY }}
          KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS_QLTY }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_KEY}" >"${HOME}/.ssh/deploy_key"
          printf '%s\n' "${KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/deploy_key" "${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${HOME}/.ssh/deploy_key" >/dev/null

      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy/deploy-frontend.sh
          bash -n scripts/deploy/run-redeploy-remote.sh
          bash -n scripts/deploy/verify-external-frontend.sh

      - name: Deploy verified frontend
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          TARGET_DIGEST: ${{ needs.resolve.outputs.digest }}
        run: |
          set -euo pipefail
          REDEPLOY_SCRIPT_PATH=scripts/deploy/deploy-frontend.sh \
            REDEPLOY_TIMEOUT_SECONDS=4200 \
            scripts/deploy/run-redeploy-remote.sh \
            "${HOME}/.ssh/deploy_key" \
            u.hsc.qlty@200.16.7.138 \
            /home/u.hsc.qlty/sihsalus \
            "${TARGET_SHA}" \
            "${TARGET_DIGEST}" \
            "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-frontend-qlty"

      - name: Verify QLTY externally
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          scripts/deploy/verify-external-frontend.sh \
            https://gidis-hsc-qlty.inf.pucp.edu.pe \
            "${TARGET_SHA}" \
            "${REDEPLOY_EXPECTED_NODE_ID}" \
            QLTY

name: Release manifests

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published immutable deployment release to validate; empty runs synthetic contracts'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-manifests-${{ github.ref }}-${{ inputs.release_tag || 'contracts' }}
  cancel-in-progress: true

jobs:
  validate:
    name: Immutable release manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify Compose coverage and persistent release selection
        run: python3 -B tests/deploy/release-manifest-compose.py --audit
      - name: Verify metadata from unlabeled and labeled runtime images
        run: python3 -B tests/deploy/release-manifest-images.py
      - name: Verify published release asset against its source Compose
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^deployment-[a-z0-9][a-z0-9-]{0,63}$ ]]
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" \
            --jq '.immutable == true and .draft == false' | grep -qx true
          artifact_dir="$RUNNER_TEMP/release-asset"
          mkdir "$artifact_dir"
          gh release download "$RELEASE_TAG" --pattern release-manifest.json --dir "$artifact_dir"
          manifest="$artifact_dir/release-manifest.json"
          gh release verify-asset "$RELEASE_TAG" "$manifest"
          python3 -B scripts/deploy/release-manifest.py validate "$manifest"
          [[ "$RELEASE_TAG" == "deployment-$(jq -r .releaseId "$manifest")" ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$(jq -r .sources.distroCommit "$manifest")" ]]
          python3 -B tests/deploy/release-manifest-compose.py --manifest "$manifest"
          {
            echo '## Verified operational artifact'
            echo "$RELEASE_TAG"
            sha256sum "$manifest"
          } >> "$GITHUB_STEP_SUMMARY"

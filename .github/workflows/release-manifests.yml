name: Release manifests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-manifests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Immutable release manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate reviewed release history and generate exact file checksums
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BASE_SHA" =~ ^0+$ ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python3 -B scripts/deploy/release-manifest.py catalog "${args[@]}" --output release-index.json
      - name: Publish reviewed manifests and checksum index
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: release-manifests-${{ github.sha }}
          path: |
            releases/**/*.json
            release-index.json
          if-no-files-found: error
          retention-days: 90

# The gateway supplies the public scheme; direct loopback access uses HTTP.
map $http_x_forwarded_proto $orthanc_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

# Host is embedded in a quoted Forwarded value. Nginx rejects controls, but
# does not itself reject every quote or separator that could alter that value.
map $http_host $orthanc_invalid_host {
    default 1;
    "~^(?:[A-Za-z0-9](?:[A-Za-z0-9.-]{0,251}[A-Za-z0-9])?\.?|\[[0-9A-Fa-f:.]+\])(?::[0-9]{1,5})?$" 0;
}

server {
    listen 80;
    server_name orthanc-proxy;
    client_max_body_size 0;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    location / {
        if ($orthanc_invalid_host) { return 400; }
        # Resolve on requests so recreating Orthanc does not leave a stale IP.
        set $orthanc http://orthanc:8042;
        proxy_pass $orthanc;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $orthanc_forwarded_proto;
        # DICOMweb uses RFC 7239 to generate BulkDataURI and RetrieveURL. Keep
        # the public port and scheme instead of rewriting clinical JSON bodies.
        proxy_set_header Forwarded 'proto=$orthanc_forwarded_proto;host="$http_host"';
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream off;
        proxy_redirect off;
        # OHIF and Orthanc are published on the same origin. No cross-origin
        # browser grants are required by this internal proxy.
    }
}

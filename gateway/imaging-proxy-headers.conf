# Repeat the entire set: any proxy_set_header in a location cancels inheritance.
if ($imaging_invalid_host) { return 400; }
if ($imaging_cookie_too_large) { return 400; }
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header Forwarded 'proto=$forwarded_proto;host="$http_host"';
proxy_set_header X-Real-IP $forwarded_ip;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Authentication terminates at the gateway; static OHIF and Orthanc do not need
# the browser's OpenMRS/Imaging cookies or reusable authorization credentials.
proxy_set_header Cookie "";
proxy_set_header Authorization "";
